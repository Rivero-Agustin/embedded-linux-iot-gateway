name: PlatformIO CI/CD Pipeline

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del Repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ⚡ Caché de Dependencias (PlatformIO)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            firmware/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: 🛠️ Instalar PlatformIO Core
        run: pip install -U platformio

      - name: 🔐 Generar config.h de prueba
        run: |
          mkdir -p firmware/include
          cat <<EOF > firmware/include/config.h
          #pragma once
          #define WIFI_SSID "ci_dummy_wifi"
          #define WIFI_PASS "ci_dummy_pass"
          #define IS_ANCHOR true
          #define MQTT_BROKER_URI "mqtt://192.168.1.100:1883"
          #define MQTT_TOPIC_TELEMETRY "dummy/telemetry"
          #define MQTT_TOPIC_COMMANDS  "dummy/commands"
          EOF

      - name: 🧪 Ejecutar Pruebas Unitarias (Native)
        run: pio test -d firmware -e native

      - name: ⚙️ Compilar Firmware (ESP32)
        run: pio run -d firmware

      - name: 📦 Exportar Binario Generado
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-bin
          path: firmware/.pio/build/*/firmware.bin
          if-no-files-found: error
