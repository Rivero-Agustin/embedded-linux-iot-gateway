name: PlatformIO CI/CD Pipeline

on:
  push:
    branches: ["main", "feature/*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"

jobs:
  # ---------------------------------------------------
  # ETAPA 1: NUBE (Lógica Pura y Compilación)
  # ---------------------------------------------------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del Repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ⚡ Caché de Dependencias (PlatformIO)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            firmware/.pio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: 🛠️ Instalar PlatformIO Core
        run: pip install -U platformio

      - name: 🔐 Generar config.h de prueba
        run: |
          mkdir -p firmware/include
          cat <<EOF > firmware/include/config.h
          #pragma once
          #define WIFI_SSID "ci_dummy_wifi"
          #define WIFI_PASS "ci_dummy_pass"
          #define IS_ANCHOR true
          #define MQTT_BROKER_URI "mqtt://192.168.1.100:1883"
          #define MQTT_TOPIC_TELEMETRY "dummy/telemetry"
          #define MQTT_TOPIC_COMMANDS  "dummy/commands"
          EOF

      - name: 🧪 Ejecutar Pruebas Unitarias (Native)
        run: pio test -d firmware -e native

      - name: ⚙️ Compilar Firmware (ESP32)
        run: pio run -d firmware -e esp-wrover-kit

      - name: 📦 Exportar Binario Generado
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-bin
          path: firmware/.pio/build/*/firmware.bin
          if-no-files-found: error
  # ---------------------------------------------------
  # ETAPA 2: HARDWARE-IN-THE-LOOP & DESPLIEGUE (Tu Runner)
  # ---------------------------------------------------
  hardware_test:
    needs: build # Solo corre si la compilación en la nube pasó
    runs-on: self-hosted
    environment: production

    steps:
      - name: 📥 Checkout del Repositorio
        uses: actions/checkout@v4

      - name: 🛠️ Instalar PlatformIO en el Runner
        run: pip3 install -U platformio --break-system-packages || pip install -U platformio --break-system-packages

      # --- 1. PRUEBAS EN HARDWARE (Con config de test) ---
      - name: 🔐 Generar config.h para Pruebas
        run: |
          mkdir -p firmware/include
          cat <<EOF > firmware/include/config.h
          #pragma once
          #define WIFI_SSID "ci_dummy_wifi"
          #define WIFI_PASS "ci_dummy_pass"
          #define IS_ANCHOR true
          #define MQTT_BROKER_URI "mqtt://192.168.1.100:1883"
          #define MQTT_TOPIC_TELEMETRY "dummy/telemetry"
          #define MQTT_TOPIC_COMMANDS  "dummy/commands"
          EOF

      - name: 🧪 Ejecutar Tests en Placa Física (Unity)
        run: ~/.local/bin/pio test -d firmware -e esp-wrover-kit

      # --- 2. DESPLIEGUE REAL (Solo en rama 'main' si los tests pasaron) ---
      - name: 🔐 Inyectar Credenciales Reales de Producción
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          PROD_WIFI_SSID: ${{ secrets.WIFI_SSID }}
          PROD_WIFI_PASS: ${{ secrets.WIFI_PASS }}
          PROD_MQTT_URI: ${{ secrets.MQTT_BROKER_URI }}
        run: |
          cat <<EOF > firmware/include/config.h
          #pragma once
          #define WIFI_SSID "$PROD_WIFI_SSID"
          #define WIFI_PASS "$PROD_WIFI_PASS"
          #define IS_ANCHOR true
          #define MQTT_BROKER_URI "$PROD_MQTT_URI"
          #define MQTT_TOPIC_TELEMETRY "gateway/uwb/telemetry"
          #define MQTT_TOPIC_COMMANDS  "gateway/uwb/commands"
          EOF

      - name: 🚀 Flashear Firmware de Producción al ESP32
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: ~/.local/bin/pio run -d firmware -e esp-wrover-kit --target upload
