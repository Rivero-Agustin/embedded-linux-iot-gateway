; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp-wrover-kit]
platform = espressif32
board = esp-wrover-kit
framework = arduino, espidf

; Forzamos el tamaño real del chip a 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv

; Velocidad del monitor serie
monitor_speed = 115200
monitor_filters = direct, esp32_exception_decoder

; Configuraciones para la placa UWB Pro (habilitar PSRAM)
build_flags = 
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; --- DIRECTIVAS PARA LA LIBRERÍA DW1000 ---
    -Wno-error=class-memaccess
    -Wno-error=format-truncation
    -Wno-error=return-type

; Forzamos al compilador a deshabilitar el modo estricto
build_unflags = 
    -Werror=all

; Librerías requeridas para usar la pantalla OLED
lib_deps = 
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9